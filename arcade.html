<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
		<title>Vio's Arcade - Web Games</title>

		<link rel="preload" as="image" href="images/viosarcade.png">
		<link rel="preload" as="image" href="images/placeholderbg.png">
		<link rel="preload" as="image" href="images/yoda.png">

		<link rel="stylesheet" href="styles/main.css">
		<script src="scripts/main.js"></script>
		<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
		<style>
			#arcadeGames {
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: 16px;
				max-width: 1050px;
				margin: 0 auto;
				padding: 16px 0;
			}
			.arcadeGame {
				display: flex;
				flex-direction: column;
				gap: 10px;
				padding: 12px;
				background: #3d3d3d;
				border: 1px solid #707070;
				border-radius: 8px;
				text-align: center;
				font-size: clamp(12px, 2vw, 22px);
				overflow-wrap: anywhere;
			}
			.arcadeGame img {
				display: block;
				width: 100%;
				aspect-ratio: 4 / 3;
				object-fit: contain;
			}
			.arcadeGame:hover, .arcadeGame:focus-visible {
				background: #505050;
				outline: 2px solid #47b2ff;
				outline-offset: 2px;
			}
			@media (max-width: 600px) {
				#arcadeGames { gap: 8px; }
				.arcadeGame { padding: 6px; }
			}
		</style>
	</head>
